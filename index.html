<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café & Graça — Avalie seu atendimento</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    background: #f4ede4; color: #3b2a20; padding: 20px;
  }
  .card {
    background: #fffaf4; width: 100%; max-width: 440px; padding: 32px 28px;
    border-radius: 16px; box-shadow: 0 8px 30px rgba(59, 42, 32, .12);
  }
  h1 { margin: 0 0 4px; text-align: center; font-size: 2rem; }
  .sub { text-align: center; margin: 0 0 28px; color: #7a5c48; font-style: italic; }
  label { display: block; font-weight: bold; margin: 20px 0 8px; }
  input[type=text], textarea {
    width: 100%; padding: 12px; font: inherit; font-size: 1rem;
    border: 1px solid #d8c6b5; border-radius: 10px; background: #fff;
  }
  textarea { min-height: 110px; resize: vertical; }
  .stars { display: flex; flex-direction: row-reverse; justify-content: center; gap: 6px; }
  .stars input { display: none; }
  .stars label { margin: 0; font-size: 2.6rem; color: #d8c6b5; cursor: pointer; font-weight: normal; }
  .stars input:checked ~ label,
  .stars label:hover, .stars label:hover ~ label { color: #c8902e; }
  button {
    margin-top: 28px; width: 100%; padding: 14px; font: inherit; font-size: 1.1rem;
    background: #6b4226; color: #fff; border: 0; border-radius: 10px; cursor: pointer;
  }
  button:hover { background: #54331d; }
  .thanks { display: none; text-align: center; }
  .thanks.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Café & Graça</h1>
  <p class="sub">Conte-nos como foi seu atendimento</p>

  <form id="form" action="https://formsubmit.co/joshcamgoossen@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="Nova avaliação — Café & Graça">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="text" name="_honey" style="display:none">

    <label for="atendente">Quem me atendeu?</label>
    <input type="text" id="atendente" name="Quem me atendeu" required>

    <label>Avaliação</label>
    <div class="stars">
      <input type="radio" id="s5" name="Avaliação" value="5 estrelas" required><label for="s5">★</label>
      <input type="radio" id="s4" name="Avaliação" value="4 estrelas"><label for="s4">★</label>
      <input type="radio" id="s3" name="Avaliação" value="3 estrelas"><label for="s3">★</label>
      <input type="radio" id="s2" name="Avaliação" value="2 estrelas"><label for="s2">★</label>
      <input type="radio" id="s1" name="Avaliação" value="1 estrela"><label for="s1">★</label>
    </div>

    <label for="comentarios">Comentários</label>
    <textarea id="comentarios" name="Comentários"></textarea>

    <button type="submit">Enviar</button>
  </form>

  <div class="thanks" id="thanks">
    <p style="font-size:1.4rem">Obrigado pela sua avaliação! ☕</p>
  </div>
</div>
<script>
  const form = document.getElementById('form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = 'Enviando...';
    try {
      const res = await fetch('https://formsubmit.co/ajax/joshcamgoossen@gmail.com', {
        method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(form)
      });
      if (!res.ok) throw new Error();
      form.style.display = 'none';
      document.getElementById('thanks').classList.add('show');
    } catch {
      btn.disabled = false; btn.textContent = 'Enviar';
      alert('Não foi possível enviar. Tente novamente.');
    }
  });
</script>
</body>
</html>
